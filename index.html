<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rabbit Runner 🐇</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #f7f7f7;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            transition: background-color 1s ease;
        }
        body.dark-mode {
            background-color: #1a252f;
        }
        body.dark-mode .score-board {
            color: #ecf0f1;
        }
        body.dark-mode #start-screen { background-color: rgba(44, 62, 80, 0.95); }
        body.dark-mode #start-screen h2 { color: #fff; }
        body.dark-mode #game-container {
            background-color: #2c3e50;
            border-bottom-color: #ecf0f1;
        }
        body.dark-mode #game-over-screen {
            background-color: rgba(44, 62, 80, 0.9);
        }
        body.dark-mode #game-over-subtitle {
            color: #bdc3c7;
        }
        .item {
            width: 30px;
            height: 30px;
            font-size: 24px;
            position: absolute;
            display: flex;
            align-items: center;
            justify-content: center;
            left: 600px;
        }
        #status-buff {
            position: absolute;
            top: 15px;
            left: 15px;
            font-weight: bold;
            font-size: 14px;
            color: #f1c40f;
            display: none;
            background: rgba(0,0,0,0.7);
            padding: 4px 8px;
            border-radius: 4px;
            z-index: 5;
        }
        .invincible {
            animation: flash 0.2s infinite alternate;
            filter: drop-shadow(0 0 8px #f1c40f);
        }
        /* 1. 狂暴攻擊狀態的兔子 */
        .rage-mode {
            transform: scaleX(-1) scale(1.3) !important; /* 變大隻 */
            filter: drop-shadow(0 0 8px #e67e22) hue-rotate(300deg); /* 發出紅色/橘色光芒 */
        }

        /* 2. 狀態文字提示新增狂暴模式的顏色 */
        #status-buff.attack-buff {
            color: #e74c3c;
            border: 1px solid #e74c3c;
        }

        @keyframes flash {
            0% { opacity: 0.5; transform: scale(-1,1) scale(1.1); }
            100% { opacity: 1; transform: scale(-1,1) scale(1.1); }
        }
        #score-container {
            display: flex;
            gap: 30px;
            margin-bottom: 15px;
        }
        .score-board {
            font-size: 24px;
            font-weight: bold;
            color: #333;
        }
        #high-score-board {
            color: #27ae60; /* Green color for the high score record */
        }
        #game-container {
            width: 95%;
            max-width: 600px; 
            aspect-ratio: 600 / 250; /* 🔗 鎖定黃金比例！不論螢幕多小，高度永遠是寬度的 41.6% */
            min-height: 160px;       /* 🛡️ 安全鎖：確保在極小的舊手機上，高度絕對不會低於 160px */
            border-bottom: 4px solid #333;
            position: relative;
            background-color: #fff;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            border-radius: 4px;
            cursor: pointer;
        }
        /* Rabbit Player */
        #rabbit {
            width: 40px;
            height: 40px;
            font-size: 32px;
            position: absolute;
            bottom: 0px; 
            left: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            transform: scale(-1,1);
        }
        /* Red Obstacle */
        #obstacle {
            width: 20px;
            height: 45px; 
            background-color: #e74c3c;
            border-radius: 4px 4px 0 0;
            position: absolute;
            bottom: 0;
            left: 600px;
        }
        /* Game Over Screen Overlay */
        #game-over-screen {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(255, 255, 255, 0.85);
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            z-index: 10;
        }
        #game-over-title {
            font-size: 32px;
            font-weight: 900;
            color: #e74c3c;
            margin-bottom: 8px;
        }
        #game-over-subtitle {
            font-size: 16px;
            color: #555;
        }
    </style>
</head>
<body>

    <div id="score-container">
        <div class="score-board">SCORE: <span id="score">0</span></div>
        <div class="score-board" id="high-score-board">HIGHEST SCORE: <span id="high-score">0</span></div>
    </div>
    
    <div id="game-container">
        <div id="start-screen" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(255,255,255,0.9); flex-direction: column; align-items: center; justify-content: center; display: flex; z-index: 20;">
            <h2 style="margin-bottom: 15px; color: #333;">🐇Rabbit Runner</h2>
            <button id="start-btn" type="button" style="padding: 10px 25px; font-size: 18px; font-weight: bold; background-color: #27ae60; color: white; border: none; border-radius: 5px; cursor: pointer; transition: background 0.2s;">START GAME</button>
        </div>

        <div id="status-buff">⭐ INVINCIBLE</div>
        <div id="rabbit">🐇</div>
        <div id="obstacle"></div>
        <div id="item-spawn" class="item"></div>
        
        <div id="game-over-screen">
            <div id="game-over-title">GAME OVER</div>
            <div id="game-over-subtitle">Click anywhere here to Restart</div>
        </div>
    </div>

    <script>
        const startScreen = document.getElementById("start-screen");
        const startBtn = document.getElementById("start-btn");

        let isStarted = false; // 👈 全新變數：紀錄遊戲是否已經開始
        const rabbit = document.getElementById("rabbit");
        const obstacle = document.getElementById("obstacle");
        const scoreDisplay = document.getElementById("score");
        const highScoreDisplay = document.getElementById("high-score");
        const gameOverScreen = document.getElementById("game-over-screen");
        const itemSpawn = document.getElementById("item-spawn");
        const statusBuff = document.getElementById("status-buff");

        // Add these game mechanic variables
        let itemX = 700;            
        let itemY = 0;              
        let itemType = "";          
        let isInvincible = false;   
        let currentMode = "light";  
        // Game state variables
        let score = 0;
        // Fetch saved high score from localStorage, default to 0 if none exists
        let highScore = localStorage.getItem("crocHighScore") ? parseInt(localStorage.getItem("crocHighScore")) : 0;
        let isGameOver = false;

        let isAttacking = false; 
        let attackTimeout = null; // 用來記錄 3 秒倒數計時
        
        // Show initial high score on screen setup
        highScoreDisplay.innerText = highScore;

        // Physics variables
        let crocY = 0;             
        let velocityY = 0;         
        const gravity = 0.6;       
        const jumpForce = 10;      
        const doubleJumpForce = 9; 
        let jumpCount = 0;         

        // Obstacle variables
        let obstacleSpeed = 6;
        let obstaclePosition = 600;
        let obstacleHeight = 45;

        // Key listeners (Only handles jump now, space to restart is removed)
        document.addEventListener("keydown", function(event) {
            if (event.code === "Space") {
                event.preventDefault(); 
                if (!isGameOver && isStarted) {
                    jump();
                }
            }
        });

        // Click listeners (Handles jump AND handles game restart)
        document.getElementById("game-container").addEventListener("mousedown", function(event) {
            event.preventDefault();
            // if (!isStarted) return;
            // if (isGameOver) {
            //     resetGame();
            // } else {
            //     jump();
            // }
            handlePointerAction(); // 統一交給指引函式處理
        });

        document.getElementById("game-container").addEventListener("touchstart", function(event) {
            event.preventDefault(); // ❌ 關鍵：防止手機瀏覽器誤觸兩下變成「放大畫面」
            handlePointerAction(); // 統一交給指引函式處理
        });

        function handlePointerAction() {
            // A. 如果遊戲還沒開始：點擊畫面就直接啟動遊戲（對手機非常方便！）
            if (!isStarted) {
                startGame();
                return;
            }
            
            // B. 如果已經死掉了：點擊畫面就重新開始
            if (isGameOver) {
                resetGame();
            } 
            // C. 遊戲進行中：點擊/觸控一下就發動跳躍（支援連續觸控兩下觸發二段跳）
            else {
                jump();
            }
        }

        startBtn.addEventListener("mousedown", function(event) {
            event.stopPropagation(); // 防止事件點擊冒泡到 game-container
            startGame();
        });

        startBtn.addEventListener("touchstart", function(event) {
            event.stopPropagation(); // 防止事件點擊冒泡到 game-container
            startGame();
        });

        // Jump logic execution 
        function jump() {
            if (jumpCount < 2) { 
                if (jumpCount === 0) {
                    velocityY = jumpForce; 
                } else if (jumpCount === 1) {
                    velocityY = doubleJumpForce; 
                }
                jumpCount++;
            }
        }

        function randomizeObstacle() {
            obstaclePosition = 600; 
            obstacleHeight = Math.floor(Math.random() * 50) + 35;
            obstacle.style.height = obstacleHeight + "px";
        }

        // Main game loop
        function gameLoop() {
            if (isGameOver) return;

            // 1. Rabbit gravity physics
            velocityY -= gravity; 
            crocY += velocityY;   

            if (crocY <= 0) {
                crocY = 0;
                velocityY = 0;
                jumpCount = 0; 
            }
            rabbit.style.bottom = crocY + "px";

            // 2. Obstacle movement
            obstaclePosition -= obstacleSpeed;
            if (obstaclePosition < -20) {
                score += 10;
                scoreDisplay.innerText = score;
                checkEnvironment();
                randomizeObstacle();

                if (obstacleSpeed < 14) {
                    obstacleSpeed += 0.4;
                }
            }
            obstacle.style.left = obstaclePosition + "px";
            itemX -= obstacleSpeed; 
            if (itemX < -30) {
                spawnNewItem(); 
            }
            itemSpawn.style.left = itemX + "px";

            if (itemX > 40 && itemX < 90 && itemSpawn.style.display !== "none") {
                if (itemY >= crocY - 15 && itemY <= crocY + 40) {
                    itemSpawn.style.display = "none"; 
                    if (itemType === "strawberry") {
                        score += 50; 
                        scoreDisplay.innerText = score;
                        checkEnvironment();
                    } else if (itemType === "star") {
                        activateInvincible(); 
                    }
                }
            }
            // 3. Collision detection
            if (obstaclePosition > 50 && obstaclePosition < 90 && crocY < obstacleHeight) {
                if (isInvincible) {
                randomizeObstacle(); // 👈 Destroys/resets obstacle safely if invincible
                } else {
                    endGame();
                }
            }

            requestAnimationFrame(gameLoop);
        }

        function startGame() {
            isStarted = true;
            startScreen.style.display = "none"; // 隱藏開始畫面
            
            // 初始化並正式啟動遊戲迴圈
            randomizeObstacle();
            spawnNewItem();
            gameLoop(); 
        }

        function endGame() {
            isGameOver = true;
            gameOverScreen.style.display = "flex";

            // Check if current score beats the permanent high score record
            if (score > highScore) {
                highScore = score;
                highScoreDisplay.innerText = highScore;
                localStorage.setItem("crocHighScore", highScore); // Save directly to local browser memory
            }
        }

        function resetGame() {
            score = 0;
            crocY = 0;
            velocityY = 0;
            jumpCount = 0;
            obstacleSpeed = 6;
            isGameOver = false;
            gameOverScreen.style.display = "none";
            scoreDisplay.innerText = score;
            
            randomizeObstacle(); 
            gameLoop();
        }

        // Function to spawn an item (ground or air)
        function spawnNewItem() {
            itemX = 800 + Math.random() * 300; 
            const yPositions =[0, 70, 125]; // Ground, Low air, High air
            itemY = yPositions[Math.floor(Math.random() * yPositions.length)];
            
            if (Math.random() < 0.8) {
                itemType = "strawberry";
                itemSpawn.innerText = "🥕";
            } else {
                itemType = "star";
                itemSpawn.innerText = "⭐";
            }
            itemSpawn.style.bottom = itemY + "px";
            itemSpawn.style.display = "flex";
        }

        // Function to trigger invincibility
        function activateInvincible() {
            isInvincible = true;
            rabbit.classList.add("invincible");
            statusBuff.style.display = "block";
            
            setTimeout(() => {
                isInvincible = false;
                rabbit.classList.remove("invincible");
                statusBuff.style.display = "none";
            }, 5000); // lasts 5 seconds
        }

        // Function to handle the Day/Night cycle transition
        function checkEnvironment() {
            if (score > 0 && Math.floor(score / 100) % 2 === 1) {
                if (currentMode === "light") {
                    currentMode = "dark";
                    document.body.classList.add("dark-mode");
                }
            } else {
                if (currentMode === "dark") {
                    currentMode = "light";
                    document.body.classList.remove("dark-mode");
                }
            }
        }


        // randomizeObstacle();
        // gameLoop();
    </script>
</body>
</html>
